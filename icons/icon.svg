      <line x1="300" y1="370" x2="440" y2="230" />
      <line x1="300" y1="410" x2="440" y2="270" />
      <line x1="300" y1="450" x2="440" y2="310" />
      <line x1="300" y1="490" x2="440" y2="350" />
